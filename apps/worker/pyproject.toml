[project]
name = "scoutlink-worker"
version = "0.1.0"
description = "ScoutLink background worker"
requires-python = ">=3.11"
dependencies = ["scoutlink-api"]

[project.scripts]
scoutlink-worker = "scoutlink_worker.main:run"

[tool.uv.sources]
scoutlink-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoutlink_worker"]
